global:
  proxy:
    no_proxy: ""
    http_proxy: ""
    https_proxy: ""

name: vssui
image:
  repository: intel/vss-ui
  tag: "latest"
  pullPolicy: IfNotPresent
  resources: {}

containerPortName: vssui-port # Optional name to refer containerPort
service:
  type: ClusterIP
  port: 80 # Port on which service listens for incoming connection

pipelineManagerEndpoint: "/manager"
assetsEndpoint: "/minio"

feature:
  summary: ""
  search: ""
  mux: ""

# Runtime-editable config for the camera-based Map View (docs/user-guide/camera-map-view.md).
# Rendered to a ConfigMap and mounted read-only over the built image's map-config.json,
# so cameras can be changed with `helm upgrade` and no image rebuild.
mapConfig:
  cameras: {}
    # lobby-cam:
    #   lat: 37.3875
    #   lon: -121.9636
    #   label: "Lobby Camera"
